<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delhi Legislative Assembly — Constituency Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<style>
  :root{
    --bg: oklch(98% 0.004 80);
    --panel: oklch(99.3% 0.002 80);
    --border: oklch(89% 0.004 80);
    --text: oklch(23% 0.01 80);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;flex-direction:column;height:100vh;}
  header{
    padding:14px 24px;border-bottom:1px solid var(--border);background:var(--panel);
  }
  header h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-0.01em;}
  main#mapWrap{flex:1;position:relative;min-width:0;}
  #map{position:absolute;inset:0;background:var(--bg);}
  .divlabel{
    font-size:11px;font-weight:700;color:oklch(20% 0.01 80);text-shadow:0 0 3px white,0 0 3px white,0 0 3px white;
    pointer-events:none;white-space:nowrap;
  }
  .leaflet-tooltip.ac-tip{font-family:inherit;font-size:15px;padding:8px 12px;}
</style>
</head>
<body>
<div id="app">
  <header><h1>Vidhan Sabha Constituencies of Delhi</h1></header>
  <main id="mapWrap"><div id="map"></div></main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script>
(function(){
  var map = L.map('map', {
    attributionControl:false, zoomControl:true, scrollWheelZoom:true,
    dragging:true, doubleClickZoom:true, boxZoom:true, keyboard:false,
    touchZoom:true, tap:true
  }).setView([28.65,77.12],10);

  var HUES = [25,70,122,175,225,270,320];
  function groupColor(i){ return 'oklch(74% 0.1 ' + HUES[i % HUES.length] + ')'; }
  function groupStroke(i){ return 'oklch(38% 0.1 ' + HUES[i % HUES.length] + ')'; }

  function extractPolys(geom){
    if(geom.type === 'Polygon') return [geom.coordinates[0]];
    if(geom.type === 'MultiPolygon') return geom.coordinates.map(function(p){return p[0];});
    if(geom.type === 'GeometryCollection') {
      var out = [];
      geom.geometries.forEach(function(g){ out = out.concat(extractPolys(g)); });
      return out;
    }
    return [];
  }
  function ringArea(ring){
    var a = 0;
    for(var i=0;i<ring.length-1;i++){
      a += ring[i][0]*ring[i+1][1] - ring[i+1][0]*ring[i][1];
    }
    return a/2;
  }
  function ringCentroid(ring){
    var cx=0, cy=0, area=0;
    for(var i=0;i<ring.length-1;i++){
      var x0=ring[i][0], y0=ring[i][1], x1=ring[i+1][0], y1=ring[i+1][1];
      var f = x0*y1 - x1*y0;
      cx += (x0+x1)*f; cy += (y0+y1)*f; area += f;
    }
    area/=2;
    if(Math.abs(area) < 1e-12) return ring[0];
    return [cx/(6*area), cy/(6*area)];
  }
  function featureCentroid(geom){
    var polys = extractPolys(geom);
    var best = null, bestArea = -1;
    polys.forEach(function(ring){
      var a = Math.abs(ringArea(ring));
      if(a > bestArea){ bestArea = a; best = ring; }
    });
    if(!best) return null;
    var c = ringCentroid(best);
    return [c[1], c[0]]; // lat,lng
  }

  function cleanName(n){ return n.replace(/\s*\(SC\)\s*$/i,'').replace(/\(SC\)/i,'').trim(); }

  var groupIndex = {}, fullBounds;

  fetch('state_ut/delhi/assembly/delhi_AC.json').then(function(r){return r.json();}).then(function(data){
    var pcNames = [];
    data.features.forEach(function(f){
      var pc = f.properties.PC_NAME;
      if(pcNames.indexOf(pc) === -1) pcNames.push(pc);
    });
    pcNames.sort();
    pcNames.forEach(function(pc,i){ groupIndex[pc] = i; });

    var geoLayer = L.geoJSON(data, {
      style: function(feature){
        var idx = groupIndex[feature.properties.PC_NAME] || 0;
        return {color: groupStroke(idx), weight: 1.3, fillColor: groupColor(idx), fillOpacity: 0.7};
      },
      onEachFeature: function(feature, layer){
        var p = feature.properties;
        layer.bindTooltip(p.AC_NO + '. ' + cleanName(p.AC_NAME), {className:'ac-tip', sticky:true});
        layer.on('mouseover', function(){ layer.setStyle({weight:2.6}); });
        layer.on('mouseout', function(){ layer.setStyle({weight:1.3}); });
        layer.on('click', function(){ map.fitBounds(layer.getBounds(), {padding:[40,40]}); });
      }
    }).addTo(map);

    var labelLayer = L.layerGroup().addTo(map);
    data.features.forEach(function(f){
      var c = featureCentroid(f.geometry);
      if(!c) return;
      L.marker(c, {
        icon: L.divIcon({className:'divlabel', html: String(f.properties.AC_NO), iconSize:null}),
        interactive:false,
        keyboard:false
      }).addTo(labelLayer);
    });

    fullBounds = geoLayer.getBounds();
    map.invalidateSize();
    map.fitBounds(fullBounds, {padding:[20,20]});
    setTimeout(function(){ map.invalidateSize(); map.fitBounds(fullBounds, {padding:[20,20]}); }, 250);
  });

  window.addEventListener('load', function(){ map.invalidateSize(); });
  window.addEventListener('resize', function(){ map.invalidateSize(); });
})();
</script>
</body>
</html>
